name: Inspect Local Backend

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02 > /tmp/v08.b64
          base64 -d /tmp/v08.b64 > /tmp/v08.tar.gz
          tar -xzf /tmp/v08.tar.gz -C .
      - name: Print integration files
        run: |
          for f in \
            lib/ui/assistant_shell.dart \
            lib/ui/assistant_page.dart \
            lib/storage/memory_store.dart \
            lib/ui/home_page.dart \
            lib/llm/brain_router.dart \
            lib/net/pc_bridge.dart \
            lib/core/dream_pulse_engine.dart \
            lib/core/models.dart; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            sed -n '1,560p' "$f"
          done
