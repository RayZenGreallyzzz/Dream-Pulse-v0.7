name: Inspect Local Backend

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02 > /tmp/v08.b64
          base64 -d /tmp/v08.b64 > /tmp/v08.tar.gz
          tar -xzf /tmp/v08.tar.gz -C .
      - name: Print Dream Pulse core
        run: |
          echo '===== core files ====='
          find lib/core -maxdepth 2 -type f -print | sort || true
          for f in lib/core/*.dart; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            sed -n '1,280p' "$f"
          done
          echo '===== engine references ====='
          grep -RniE 'DreamPulseEngine|CriticRing|worker|processor|assimil|absorb|memory|core' lib/ui lib/llm lib/core | head -300 || true
