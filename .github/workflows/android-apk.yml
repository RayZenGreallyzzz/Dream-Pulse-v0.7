name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ci/v08m.part.*'
      - 'patches/v08/**'
      - 'patches/v081/**'
      - 'patches/v082/**'
      - 'patches/v09/**'
      - 'patches/v092/**'
      - 'patches/v093/**'
      - 'patches/v094/**'
      - 'patches/v095/**'
      - 'patches/v096/**'
      - 'patches/v097/**'
      - 'patches/v098/**'
      - 'patches/v010/**'
      - 'patches/v0101/**'
      - '.github/workflows/android-apk.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Dream Pulse v0.8 source
        run: |
          echo "GitHub part hashes:"
          sha256sum ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02
          wc -c ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02
          cat ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02 > /tmp/v08.b64
          base64 -d /tmp/v08.b64 > /tmp/v08.tar.gz
          echo "8b5ba1caa9455ce8e6f2ac99af7546d0a597c218083325923f338048ebeb1957  /tmp/v08.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v08.tar.gz -C .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/llm/qwen_model_installer.dart
          test -f scripts/bootstrap_android.sh

      - name: Apply v0.8 sharp UI and avatar scene fixes
        run: |
          cp patches/v08/lib/main.dart lib/main.dart
          cp patches/v08/lib/ui/avatar_page.dart lib/ui/avatar_page.dart
          python3 patches/v08/patch.py
          grep -q "version: 0.8.0+8" pubspec.yaml
          grep -q "Qwen3-1.7B-Q4_K_M.gguf" lib/llm/qwen_model_installer.dart
          rm -rf patches/v08

      - name: Apply v0.8.1 launch, installer, package and signing
        run: |
          mkdir -p lib/llm lib/ui scripts ci/test-signing
          cp patches/v081/lib/main.dart lib/main.dart
          cp patches/v081/lib/llm/qwen_model_installer.dart lib/llm/qwen_model_installer.dart
          cp patches/v081/lib/ui/launch_gate.dart lib/ui/launch_gate.dart
          cp patches/v081/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          cp patches/v081/scripts/bootstrap_android.sh scripts/bootstrap_android.sh
          cp patches/v081/ci/test-signing/dream-pulse-test.jks.b64 ci/test-signing/dream-pulse-test.jks.b64
          chmod +x scripts/bootstrap_android.sh
          python3 patches/v081/patch_pubspec.py
          grep -q "version: 0.8.1+9" pubspec.yaml
          grep -q "path_provider" pubspec.yaml
          rm -rf patches/v081

      - name: Apply v0.8.2 strict 4GB SAFE runtime
        run: |
          cp patches/v082/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v082/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          python3 patches/v082/patch_pubspec.py
          grep -q "version: 0.8.2+10" pubspec.yaml
          rm -rf patches/v082

      - name: Apply v0.9.1 live Core, personality and voice architecture
        run: |
          mkdir -p lib/avatar lib/core lib/llm lib/net lib/personality lib/storage lib/ui lib/voice
          cp patches/v09/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          cp patches/v09/lib/core/dream_pulse_engine.dart lib/core/dream_pulse_engine.dart
          cp patches/v09/lib/core/pulse_coordinator.dart lib/core/pulse_coordinator.dart
          cp patches/v09/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v09/lib/llm/qwen_model_installer.dart lib/llm/qwen_model_installer.dart
          cp patches/v09/lib/llm/response_sanitizer.dart lib/llm/response_sanitizer.dart
          cp patches/v09/lib/net/tablet_web_search.dart lib/net/tablet_web_search.dart
          cp patches/v09/lib/personality/personality_engine.dart lib/personality/personality_engine.dart
          cp patches/v09/lib/personality/personality_profile.dart lib/personality/personality_profile.dart
          cp patches/v09/lib/personality/personality_state.dart lib/personality/personality_state.dart
          cp patches/v09/lib/storage/memory_store.dart lib/storage/memory_store.dart
          cp patches/v09/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          cp patches/v09/lib/ui/home_page.dart lib/ui/home_page.dart
          cp patches/v09/lib/voice/voice_expression.dart lib/voice/voice_expression.dart
          python3 patches/v09/patch.py
          python3 patches/v09/patch_pubspec.py
          grep -q "version: 0.9.1+12" pubspec.yaml
          grep -q "Qwen3-0.6B-Q4_0.gguf" lib/llm/qwen_model_installer.dart
          grep -q "da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4" lib/llm/qwen_model_installer.dart
          grep -q "class PulseCoordinator" lib/core/pulse_coordinator.dart
          grep -q "class PersonalityEngine" lib/personality/personality_engine.dart
          grep -q "class ResponseSanitizer" lib/llm/response_sanitizer.dart
          grep -q "personality_state" lib/storage/memory_store.dart
          grep -q "html.duckduckgo.com" lib/net/tablet_web_search.dart
          grep -q "usesCleartextTraffic" scripts/bootstrap_android.sh
          rm -rf patches/v09

      - name: Apply v0.9.2 neural voice layer
        run: |
          mkdir -p lib/avatar lib/voice
          cp patches/v092/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          cp patches/v092/lib/voice/voice_expression.dart lib/voice/voice_expression.dart
          cp patches/v092/lib/voice/elevenlabs_voice_backend.dart lib/voice/elevenlabs_voice_backend.dart
          python3 patches/v092/patch.py
          python3 patches/v092/patch_pubspec.py
          grep -q "version: 0.9.2+13" pubspec.yaml
          grep -q "audioplayers: ^6.8.1" pubspec.yaml
          grep -q "flutter_secure_storage: ^11.2.0" pubspec.yaml
          grep -q "class ElevenLabsVoiceBackend" lib/voice/elevenlabs_voice_backend.dart
          grep -q "NEURAL // ELEVENLABS" lib/ui/assistant_page.dart
          rm -rf patches/v092

      - name: Apply v0.9.3 local Silero Baya via RuVoice
        run: |
          cp patches/v093/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          python3 patches/v093/patch.py
          python3 patches/v093/patch_pubspec.py
          grep -q "version: 0.9.3+14" pubspec.yaml
          grep -q "ru.kost.ruvoice" lib/avatar/speech_controller.dart
          grep -q "baya-ru" lib/avatar/speech_controller.dart
          grep -q "LOCAL // SILERO BAYA" lib/ui/assistant_page.dart
          rm -rf patches/v093

      - name: Apply v0.9.4 streaming model pipeline
        run: |
          mkdir -p lib/core lib/llm
          cp patches/v094/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v094/lib/llm/brain_router.dart lib/llm/brain_router.dart
          cp patches/v094/lib/core/pulse_coordinator.dart lib/core/pulse_coordinator.dart
          python3 patches/v094/patch.py
          python3 patches/v094/patch_pubspec.py
          grep -q "version: 0.9.4+15" pubspec.yaml
          grep -q "Stream<String> streamAsk" lib/llm/local_qwen_backend.dart
          grep -q "Stream<String> streamAsk" lib/llm/brain_router.dart
          grep -q "Stream<String> askStream" lib/core/pulse_coordinator.dart
          grep -q "GENERATION_CANCELLED" lib/core/pulse_coordinator.dart
          grep -q "hiddenStockMale" lib/avatar/speech_controller.dart
          rm -rf patches/v094

      - name: Apply v0.9.5 model and Baya reliability fixes
        run: |
          mkdir -p lib/avatar lib/llm
          cp patches/v095/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v095/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          python3 patches/v095/patch.py
          python3 patches/v095/patch_pubspec.py
          grep -q "version: 0.9.5+16" pubspec.yaml
          grep -q "StreamController<String>" lib/llm/local_qwen_backend.dart
          grep -q "Baya активна" lib/avatar/speech_controller.dart
          grep -q "системный fallback заблокирован" lib/avatar/speech_controller.dart
          grep -q "ГОЛОС // BAYA" lib/ui/assistant_page.dart
          rm -rf patches/v095

      - name: Apply v0.9.6 FAST Qwen tablet profile
        run: |
          mkdir -p lib/llm
          cp patches/v096/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          python3 patches/v096/patch.py
          python3 patches/v096/patch_pubspec.py
          grep -q "version: 0.9.6+17" pubspec.yaml
          grep -q "contextSize = 1024" lib/llm/local_qwen_backend.dart
          grep -q "threads = cpu >= 4 ? 4" lib/llm/local_qwen_backend.dart
          grep -q "Qwen FAST" lib/llm/local_qwen_backend.dart
          rm -rf patches/v096

      - name: Apply v0.9.7 SMART DeepSeek and web worker
        run: |
          mkdir -p lib/core lib/llm lib/net
          cp patches/v097/lib/llm/qwen_model_installer.dart lib/llm/qwen_model_installer.dart
          cp patches/v097/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v097/lib/core/pulse_coordinator.dart lib/core/pulse_coordinator.dart
          cp patches/v097/lib/net/tablet_web_search.dart lib/net/tablet_web_search.dart
          python3 patches/v097/patch.py
          python3 patches/v097/patch_pubspec.py
          grep -q "version: 0.9.7+18" pubspec.yaml
          grep -q "DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf" lib/llm/qwen_model_installer.dart
          grep -q "1741e5b2d062b07acf048bf0d2c514dadf2a48f94e2b4aa0cfe069af3838ee2f" lib/llm/qwen_model_installer.dart
          grep -q "DeepSeek R1 1.5B SMART" lib/llm/local_qwen_backend.dart
          grep -q "www.bing.com" lib/net/tablet_web_search.dart
          grep -q "УСТАНОВИТЬ DEEPSEEK 1.5B SMART" lib/ui/launch_gate.dart
          rm -rf patches/v097

      - name: Apply v0.9.8 truthful live Core telemetry
        run: |
          mkdir -p lib/ui
          cp patches/v098/lib/ui/home_page.dart lib/ui/home_page.dart
          python3 patches/v098/patch.py
          python3 patches/v098/patch_pubspec.py
          grep -q "version: 0.9.8+19" pubspec.yaml
          grep -q "IDLE · STATIC" lib/ui/home_page.dart
          grep -q "BACKEND" lib/ui/home_page.dart
          grep -q "REAL TASKS ONLY" lib/ui/home_page.dart
          rm -rf patches/v098

      - name: Apply v0.10 DeepSeek LOCAL API and clean chat
        run: |
          mkdir -p lib/llm lib/ui
          cp patches/v010/lib/llm/local_deepseek_backend.dart lib/llm/local_deepseek_backend.dart
          cp patches/v010/lib/llm/deepseek_model_installer.dart lib/llm/deepseek_model_installer.dart
          cp patches/v010/lib/llm/deepseek_api_backend.dart lib/llm/deepseek_api_backend.dart
          cp patches/v010/lib/llm/brain_router.dart lib/llm/brain_router.dart
          cp patches/v010/lib/ui/assistant_page.dart lib/ui/assistant_page.dart
          cp patches/v010/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          cp patches/v010/lib/ui/launch_gate.dart lib/ui/launch_gate.dart
          rm -f lib/llm/local_qwen_backend.dart lib/llm/qwen_model_installer.dart
          python3 patches/v010/patch_pubspec.py
          grep -q "version: 0.10.0+20" pubspec.yaml
          grep -q "enum BrainMode { auto, local, api }" lib/llm/brain_router.dart
          grep -q "DeepSeek V4 Flash" lib/llm/deepseek_api_backend.dart
          grep -q "class LocalDeepSeekBackend" lib/llm/local_deepseek_backend.dart
          grep -q "class DeepSeekModelInstaller" lib/llm/deepseek_model_installer.dart
          grep -q "class _PlainMessage" lib/ui/assistant_page.dart
          test ! -f lib/llm/local_qwen_backend.dart
          test ! -f lib/llm/qwen_model_installer.dart
          ! grep -R "Qwen3 0.6B" lib
          rm -rf patches/v010

      - name: Apply v0.10.1 Groq Free online brain
        run: |
          mkdir -p lib/llm lib/ui
          cp patches/v0101/lib/llm/groq_api_backend.dart lib/llm/groq_api_backend.dart
          cp patches/v0101/lib/llm/brain_router.dart lib/llm/brain_router.dart
          cp patches/v0101/lib/ui/assistant_page.dart lib/ui/assistant_page.dart
          cp patches/v0101/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          python3 patches/v0101/patch.py
          python3 patches/v0101/patch_pubspec.py
          grep -q "version: 0.10.1+21" pubspec.yaml
          grep -q "enum BrainMode { auto, groq, local, deepseek }" lib/llm/brain_router.dart
          grep -q "openai/gpt-oss-120b" lib/llm/groq_api_backend.dart
          grep -q "api.groq.com/openai/v1/chat/completions" lib/llm/groq_api_backend.dart
          grep -q "AUTO never spends money" lib/llm/brain_router.dart
          grep -q "GROQ FREE" lib/ui/assistant_page.dart
          grep -q "deepseek-flash" lib/llm/deepseek_api_backend.dart
          rm -rf patches/v0101

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install Android CMake 3.31.4
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.31.4"
          test -x "$ANDROID_HOME/cmake/3.31.4/bin/cmake"

      - name: Bootstrap Android project
        run: |
          bash scripts/bootstrap_android.sh
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.intent.action.TTS_SERVICE' not in s:
              block = '''        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n'''
              if '</queries>' in s:
                  s = s.replace('    </queries>', block + '    </queries>', 1)
              else:
                  s = s.replace('<application', '    <queries>\n' + block + '    </queries>\n    <application', 1)
          p.write_text(s)
          PY
          grep -q 'com.dreampulse.assistant' android/app/build.gradle.kts
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml
          test -f android/app/dream-pulse-test.jks
          test -f android/app/src/main/res/drawable/dream_pulse_icon.xml

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-pulse-v0.10.1-groq-free-local-web-clean-chat-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
