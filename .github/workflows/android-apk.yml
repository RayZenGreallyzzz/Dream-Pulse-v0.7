name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ci/v08m.part.*'
      - 'patches/v08/**'
      - '.github/workflows/android-apk.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Dream Pulse v0.8 source
        run: |
          echo "GitHub part hashes:"
          sha256sum ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02
          wc -c ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02
          cat ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02 > /tmp/v08.b64
          base64 -d /tmp/v08.b64 > /tmp/v08.tar.gz
          echo "8b5ba1caa9455ce8e6f2ac99af7546d0a597c218083325923f338048ebeb1957  /tmp/v08.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v08.tar.gz -C .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/llm/qwen_model_installer.dart
          test -f scripts/bootstrap_android.sh

      - name: Apply sharp UI and avatar scene fixes
        run: |
          cp patches/v08/lib/main.dart lib/main.dart
          cp patches/v08/lib/ui/avatar_page.dart lib/ui/avatar_page.dart
          python3 patches/v08/patch.py
          grep -q "version: 0.8.0+8" pubspec.yaml
          grep -q "Qwen3-1.7B-Q4_K_M.gguf" lib/llm/qwen_model_installer.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install Android CMake 3.31.4
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.31.4"
          test -x "$ANDROID_HOME/cmake/3.31.4/bin/cmake"

      - name: Bootstrap Android project
        run: |
          bash scripts/bootstrap_android.sh
          rm -f test/widget_test.dart

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-pulse-v0.8-sharp-ui-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
