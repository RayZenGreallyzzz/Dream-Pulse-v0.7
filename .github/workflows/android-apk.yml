name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, fix/tts-install-voice-ui-v0160 ]
    paths:
      - 'ci/v08m.part.*'
      - 'patches/v08/**'
      - 'patches/v081/**'
      - 'patches/v082/**'
      - 'patches/v09/**'
      - 'patches/v092/**'
      - 'patches/v093/**'
      - 'patches/v094/**'
      - 'patches/v095/**'
      - 'patches/v096/**'
      - 'patches/v097/**'
      - 'patches/v098/**'
      - 'patches/v010/**'
      - 'patches/v0101/**'
      - 'patches/v0102/**'
      - 'patches/v0103/**'
      - 'patches/v011/**'
      - 'patches/v0111/**'
      - 'patches/v012/**'
      - 'patches/v0121/**'
      - 'patches/v013/**'
      - 'patches/v014/**'
      - 'patches/v015/**'
      - 'patches/v0151/**'
      - 'patches/v0152/**'
      - 'patches/v0153/**'
      - 'patches/v0154/**'
      - 'patches/v0155/**'
      - 'patches/v0156/**'
      - 'patches/v0158/**'
      - 'patches/v0159/**'
      - 'patches/v0160/**'
      - '.github/workflows/android-apk.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Dream Pulse v0.8 source
        run: |
          echo "GitHub part hashes:"
          sha256sum ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02
          wc -c ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02
          cat ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02 > /tmp/v08.b64
          base64 -d /tmp/v08.b64 > /tmp/v08.tar.gz
          echo "8b5ba1caa9455ce8e6f2ac99af7546d0a597c218083325923f338048ebeb1957  /tmp/v08.tar.gz" | sha256sum -c -
          tar -xzf /tmp/v08.tar.gz -C .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/llm/qwen_model_installer.dart
          test -f scripts/bootstrap_android.sh

      - name: Apply v0.8 sharp UI and avatar scene fixes
        run: |
          cp patches/v08/lib/main.dart lib/main.dart
          cp patches/v08/lib/ui/avatar_page.dart lib/ui/avatar_page.dart
          python3 patches/v08/patch.py
          grep -q "version: 0.8.0+8" pubspec.yaml
          grep -q "Qwen3-1.7B-Q4_K_M.gguf" lib/llm/qwen_model_installer.dart
          rm -rf patches/v08

      - name: Apply v0.8.1 launch, installer, package and signing
        run: |
          mkdir -p lib/llm lib/ui scripts ci/test-signing
          cp patches/v081/lib/main.dart lib/main.dart
          cp patches/v081/lib/llm/qwen_model_installer.dart lib/llm/qwen_model_installer.dart
          cp patches/v081/lib/ui/launch_gate.dart lib/ui/launch_gate.dart
          cp patches/v081/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          cp patches/v081/scripts/bootstrap_android.sh scripts/bootstrap_android.sh
          cp patches/v081/ci/test-signing/dream-pulse-test.jks.b64 ci/test-signing/dream-pulse-test.jks.b64
          chmod +x scripts/bootstrap_android.sh
          python3 patches/v081/patch_pubspec.py
          grep -q "version: 0.8.1+9" pubspec.yaml
          grep -q "path_provider" pubspec.yaml
          rm -rf patches/v081

      - name: Apply v0.8.2 strict 4GB SAFE runtime
        run: |
          cp patches/v082/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v082/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          python3 patches/v082/patch_pubspec.py
          grep -q "version: 0.8.2+10" pubspec.yaml
          rm -rf patches/v082

      - name: Apply v0.9.1 live Core, personality and voice architecture
        run: |
          mkdir -p lib/avatar lib/core lib/llm lib/net lib/personality lib/storage lib/ui lib/voice
          cp patches/v09/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          cp patches/v09/lib/core/dream_pulse_engine.dart lib/core/dream_pulse_engine.dart
          cp patches/v09/lib/core/pulse_coordinator.dart lib/core/pulse_coordinator.dart
          cp patches/v09/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v09/lib/llm/qwen_model_installer.dart lib/llm/qwen_model_installer.dart
          cp patches/v09/lib/llm/response_sanitizer.dart lib/llm/response_sanitizer.dart
          cp patches/v09/lib/net/tablet_web_search.dart lib/net/tablet_web_search.dart
          cp patches/v09/lib/personality/personality_engine.dart lib/personality/personality_engine.dart
          cp patches/v09/lib/personality/personality_profile.dart lib/personality/personality_profile.dart
          cp patches/v09/lib/personality/personality_state.dart lib/personality/personality_state.dart
          cp patches/v09/lib/storage/memory_store.dart lib/storage/memory_store.dart
          cp patches/v09/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          cp patches/v09/lib/ui/home_page.dart lib/ui/home_page.dart
          cp patches/v09/lib/voice/voice_expression.dart lib/voice/voice_expression.dart
          python3 patches/v09/patch.py
          python3 patches/v09/patch_pubspec.py
          grep -q "version: 0.9.1+12" pubspec.yaml
          grep -q "Qwen3-0.6B-Q4_0.gguf" lib/llm/qwen_model_installer.dart
          grep -q "da2572f16c06133561ce56accaa822216f2391ef4d37fba427801cd6736417d4" lib/llm/qwen_model_installer.dart
          grep -q "class PulseCoordinator" lib/core/pulse_coordinator.dart
          grep -q "class PersonalityEngine" lib/personality/personality_engine.dart
          grep -q "class ResponseSanitizer" lib/llm/response_sanitizer.dart
          grep -q "personality_state" lib/storage/memory_store.dart
          grep -q "html.duckduckgo.com" lib/net/tablet_web_search.dart
          grep -q "usesCleartextTraffic" scripts/bootstrap_android.sh
          rm -rf patches/v09

      - name: Apply v0.9.2 neural voice layer
        run: |
          mkdir -p lib/avatar lib/voice
          cp patches/v092/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          cp patches/v092/lib/voice/voice_expression.dart lib/voice/voice_expression.dart
          cp patches/v092/lib/voice/elevenlabs_voice_backend.dart lib/voice/elevenlabs_voice_backend.dart
          python3 patches/v092/patch.py
          python3 patches/v092/patch_pubspec.py
          grep -q "version: 0.9.2+13" pubspec.yaml
          grep -q "audioplayers: ^6.8.1" pubspec.yaml
          grep -q "flutter_secure_storage: ^11.2.0" pubspec.yaml
          grep -q "class ElevenLabsVoiceBackend" lib/voice/elevenlabs_voice_backend.dart
          grep -q "NEURAL // ELEVENLABS" lib/ui/assistant_page.dart
          rm -rf patches/v092

      - name: Apply v0.9.3 local Silero Baya via RuVoice
        run: |
          cp patches/v093/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          python3 patches/v093/patch.py
          python3 patches/v093/patch_pubspec.py
          grep -q "version: 0.9.3+14" pubspec.yaml
          grep -q "ru.kost.ruvoice" lib/avatar/speech_controller.dart
          grep -q "baya-ru" lib/avatar/speech_controller.dart
          grep -q "LOCAL // SILERO BAYA" lib/ui/assistant_page.dart
          rm -rf patches/v093

      - name: Apply v0.9.4 streaming model pipeline
        run: |
          mkdir -p lib/core lib/llm
          cp patches/v094/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v094/lib/llm/brain_router.dart lib/llm/brain_router.dart
          cp patches/v094/lib/core/pulse_coordinator.dart lib/core/pulse_coordinator.dart
          python3 patches/v094/patch.py
          python3 patches/v094/patch_pubspec.py
          grep -q "version: 0.9.4+15" pubspec.yaml
          grep -q "Stream<String> streamAsk" lib/llm/local_qwen_backend.dart
          grep -q "Stream<String> streamAsk" lib/llm/brain_router.dart
          grep -q "Stream<String> askStream" lib/core/pulse_coordinator.dart
          grep -q "GENERATION_CANCELLED" lib/core/pulse_coordinator.dart
          grep -q "hiddenStockMale" lib/avatar/speech_controller.dart
          rm -rf patches/v094

      - name: Apply v0.9.5 model and Baya reliability fixes
        run: |
          mkdir -p lib/avatar lib/llm
          cp patches/v095/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v095/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          python3 patches/v095/patch.py
          python3 patches/v095/patch_pubspec.py
          grep -q "version: 0.9.5+16" pubspec.yaml
          grep -q "StreamController<String>" lib/llm/local_qwen_backend.dart
          grep -q "Baya активна" lib/avatar/speech_controller.dart
          grep -q "системный fallback заблокирован" lib/avatar/speech_controller.dart
          grep -q "ГОЛОС // BAYA" lib/ui/assistant_page.dart
          rm -rf patches/v095

      - name: Apply v0.9.6 FAST Qwen tablet profile
        run: |
          mkdir -p lib/llm
          cp patches/v096/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          python3 patches/v096/patch.py
          python3 patches/v096/patch_pubspec.py
          grep -q "version: 0.9.6+17" pubspec.yaml
          grep -q "contextSize = 1024" lib/llm/local_qwen_backend.dart
          grep -q "threads = cpu >= 4 ? 4" lib/llm/local_qwen_backend.dart
          grep -q "Qwen FAST" lib/llm/local_qwen_backend.dart
          rm -rf patches/v096

      - name: Apply v0.9.7 SMART DeepSeek and web worker
        run: |
          mkdir -p lib/core lib/llm lib/net
          cp patches/v097/lib/llm/qwen_model_installer.dart lib/llm/qwen_model_installer.dart
          cp patches/v097/lib/llm/local_qwen_backend.dart lib/llm/local_qwen_backend.dart
          cp patches/v097/lib/core/pulse_coordinator.dart lib/core/pulse_coordinator.dart
          cp patches/v097/lib/net/tablet_web_search.dart lib/net/tablet_web_search.dart
          python3 patches/v097/patch.py
          python3 patches/v097/patch_pubspec.py
          grep -q "version: 0.9.7+18" pubspec.yaml
          grep -q "DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf" lib/llm/qwen_model_installer.dart
          grep -q "1741e5b2d062b07acf048bf0d2c514dadf2a48f94e2b4aa0cfe069af3838ee2f" lib/llm/qwen_model_installer.dart
          grep -q "DeepSeek R1 1.5B SMART" lib/llm/local_qwen_backend.dart
          grep -q "www.bing.com" lib/net/tablet_web_search.dart
          grep -q "УСТАНОВИТЬ DEEPSEEK 1.5B SMART" lib/ui/launch_gate.dart
          rm -rf patches/v097

      - name: Apply v0.9.8 truthful live Core telemetry
        run: |
          mkdir -p lib/ui
          cp patches/v098/lib/ui/home_page.dart lib/ui/home_page.dart
          python3 patches/v098/patch.py
          python3 patches/v098/patch_pubspec.py
          grep -q "version: 0.9.8+19" pubspec.yaml
          grep -q "IDLE · STATIC" lib/ui/home_page.dart
          grep -q "BACKEND" lib/ui/home_page.dart
          grep -q "REAL TASKS ONLY" lib/ui/home_page.dart
          rm -rf patches/v098

      - name: Apply v0.10 DeepSeek LOCAL API and clean chat
        run: |
          mkdir -p lib/llm lib/ui
          cp patches/v010/lib/llm/local_deepseek_backend.dart lib/llm/local_deepseek_backend.dart
          cp patches/v010/lib/llm/deepseek_model_installer.dart lib/llm/deepseek_model_installer.dart
          cp patches/v010/lib/llm/deepseek_api_backend.dart lib/llm/deepseek_api_backend.dart
          cp patches/v010/lib/llm/brain_router.dart lib/llm/brain_router.dart
          cp patches/v010/lib/ui/assistant_page.dart lib/ui/assistant_page.dart
          cp patches/v010/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          cp patches/v010/lib/ui/launch_gate.dart lib/ui/launch_gate.dart
          rm -f lib/llm/local_qwen_backend.dart lib/llm/qwen_model_installer.dart
          python3 patches/v010/patch_pubspec.py
          grep -q "version: 0.10.0+20" pubspec.yaml
          grep -q "enum BrainMode { auto, local, api }" lib/llm/brain_router.dart
          grep -q "DeepSeek V4 Flash" lib/llm/deepseek_api_backend.dart
          grep -q "class LocalDeepSeekBackend" lib/llm/local_deepseek_backend.dart
          grep -q "class DeepSeekModelInstaller" lib/llm/deepseek_model_installer.dart
          grep -q "class _PlainMessage" lib/ui/assistant_page.dart
          test ! -f lib/llm/local_qwen_backend.dart
          test ! -f lib/llm/qwen_model_installer.dart
          ! grep -R "Qwen3 0.6B" lib
          rm -rf patches/v010

      - name: Apply v0.10.1 Groq Free online brain
        run: |
          mkdir -p lib/llm lib/ui
          cp patches/v0101/lib/llm/groq_api_backend.dart lib/llm/groq_api_backend.dart
          cp patches/v0101/lib/llm/brain_router.dart lib/llm/brain_router.dart
          cp patches/v0101/lib/ui/assistant_page.dart lib/ui/assistant_page.dart
          cp patches/v0101/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          python3 patches/v0101/patch.py
          python3 patches/v0101/patch_pubspec.py
          grep -q "version: 0.10.1+21" pubspec.yaml
          grep -q "enum BrainMode { auto, groq, local, deepseek }" lib/llm/brain_router.dart
          grep -q "openai/gpt-oss-120b" lib/llm/groq_api_backend.dart
          grep -q "api.groq.com/openai/v1/chat/completions" lib/llm/groq_api_backend.dart
          grep -q "AUTO never spends money" lib/llm/brain_router.dart
          grep -q "GROQ FREE" lib/ui/assistant_page.dart
          grep -q "deepseek-flash" lib/llm/deepseek_api_backend.dart
          rm -rf patches/v0101

      - name: Apply v0.10.2 Groq UTF-8 and private errors
        run: |
          mkdir -p lib/llm lib/ui
          cp patches/v0102/lib/llm/groq_api_backend.dart lib/llm/groq_api_backend.dart
          cp patches/v0102/lib/ui/assistant_page.dart lib/ui/assistant_page.dart
          python3 patches/v0102/patch.py
          python3 patches/v0102/patch_pubspec.py
          grep -q "version: 0.10.2+22" pubspec.yaml
          grep -q "request.add(utf8.encode(jsonEncode(payload)))" lib/llm/groq_api_backend.dart
          grep -q "'include_reasoning': false" lib/llm/groq_api_backend.dart
          ! grep -q "reasoning_format" lib/llm/groq_api_backend.dart
          grep -q "request.add(utf8.encode(jsonEncode({" lib/llm/deepseek_api_backend.dart
          grep -q "Never expose prompts" lib/ui/assistant_page.dart
          rm -rf patches/v0102

      - name: Apply v0.10.3 female voice recovery
        run: |
          mkdir -p lib/avatar lib/ui
          cp patches/v0103/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          cp patches/v0103/lib/ui/assistant_page.dart lib/ui/assistant_page.dart
          python3 patches/v0103/patch.py
          python3 patches/v0103/patch_pubspec.py
          grep -q "version: 0.10.3+23" pubspec.yaml
          grep -q "femaleVoiceOptions" lib/avatar/speech_controller.dart
          grep -q "Женский системный голос активен" lib/avatar/speech_controller.dart
          grep -q "previewCurrent" lib/avatar/speech_controller.dart
          grep -q "Голос Dream Pulse" lib/ui/assistant_page.dart
          grep -q "Baya · локальный женский голос" lib/ui/assistant_page.dart
          rm -rf patches/v0103

      - name: Apply v0.11 tools and attachments
        run: |
          mkdir -p lib/tools lib/core lib/ui
          cp patches/v011/lib/tools/attachments.dart lib/tools/attachments.dart
          cp patches/v011/lib/tools/tool_registry.dart lib/tools/tool_registry.dart
          cp patches/v011/lib/core/pulse_coordinator.dart lib/core/pulse_coordinator.dart
          cp patches/v011/lib/ui/assistant_page.dart lib/ui/assistant_page.dart
          cp patches/v011/lib/ui/assistant_shell.dart lib/ui/assistant_shell.dart
          python3 patches/v011/patch.py
          grep -q "version: 0.11.0+24" pubspec.yaml
          grep -q "class ToolRegistry" lib/tools/tool_registry.dart
          grep -q "attachments: attachments" lib/core/pulse_coordinator.dart
          grep -q "image_picker:" pubspec.yaml
          grep -q "file_picker:" pubspec.yaml
          grep -q "url_launcher:" pubspec.yaml
          grep -q "MethodChannel('dream_pulse/media')" lib/tools/tool_registry.dart

      - name: Apply v0.11.1 natural female TTS
        run: |
          mkdir -p lib/llm lib/avatar
          cp patches/v0111/lib/llm/response_sanitizer.dart lib/llm/response_sanitizer.dart
          cp patches/v0111/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          python3 patches/v0111/patch.py
          grep -q "version: 0.11.1+25" pubspec.yaml
          grep -q "static String forSpeech" lib/llm/response_sanitizer.dart
          grep -q "ResponseSanitizer.forSpeech" lib/avatar/speech_controller.dart
          grep -q "System Female" lib/avatar/speech_controller.dart
          rm -rf patches/v0111

      - name: Apply v0.12 private Dream Pulse Voice
        run: |
          mkdir -p lib/avatar lib/voice lib/ui
          cp patches/v012/lib/voice/dream_pulse_voice_backend.dart lib/voice/dream_pulse_voice_backend.dart
          cp patches/v012/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          cp patches/v012/lib/ui/assistant_page.dart lib/ui/assistant_page.dart
          python3 patches/v012/patch.py
          grep -q "version: 0.12.0+26" pubspec.yaml
          grep -q "class DreamPulseVoiceBackend" lib/voice/dream_pulse_voice_backend.dart
          grep -q "Dream Pulse Voice" lib/ui/assistant_page.dart
          grep -q "Baya" lib/avatar/speech_controller.dart
          grep -q "Kseniya" lib/avatar/speech_controller.dart
          ! grep -q "flutter_tts:" pubspec.yaml

      - name: Apply v0.12.1 lazy voice memory fix
        run: |
          mkdir -p lib/voice
          cp patches/v0121/lib/voice/dream_pulse_voice_backend.dart lib/voice/dream_pulse_voice_backend.dart
          python3 patches/v0121/patch.py
          grep -q "version: 0.12.1+27" pubspec.yaml
          grep -q "lazy" lib/voice/dream_pulse_voice_backend.dart
          ! grep -q "_warmup" lib/voice/dream_pulse_voice_backend.dart
          rm -rf patches/v0121

      - name: Apply v0.13 detachable voice pack
        run: |
          mkdir -p lib/voice
          cp patches/v013/lib/voice/dream_pulse_voice_backend.dart lib/voice/dream_pulse_voice_backend.dart
          python3 patches/v013/patch.py
          grep -q "version: 0.13.1+30" pubspec.yaml
          grep -q "bool autoSpeak = false;" lib/ui/assistant_page.dart
          grep -q "installLocalVoice" lib/avatar/speech_controller.dart
          grep -q "crypto:" pubspec.yaml

      - name: Apply v0.14 SAFE Voice
        run: |
          mkdir -p lib/voice
          cp patches/v014/lib/voice/dream_pulse_voice_backend.dart lib/voice/dream_pulse_voice_backend.dart
          python3 patches/v014/patch.py
          grep -q "version: 0.14.2+33" pubspec.yaml
          grep -q "SAFE Voice" lib/ui/assistant_page.dart
          grep -q "86494589" lib/voice/dream_pulse_voice_backend.dart
          grep -q "lastStage" lib/voice/dream_pulse_voice_backend.dart

      - name: Apply v0.15 Dream Pulse Voice Core
        run: |
          mkdir -p lib/avatar lib/voice
          cp patches/v015/lib/voice/dream_pulse_voice_backend.dart lib/voice/dream_pulse_voice_backend.dart
          cp patches/v015/lib/avatar/speech_controller.dart lib/avatar/speech_controller.dart
          python3 patches/v015/patch.py
          grep -q "version: 0.15.0+34" pubspec.yaml
          grep -q "archive: ^4.5.0" pubspec.yaml
          grep -q "Dream · Zoey-style" lib/avatar/speech_controller.dart
          grep -q "vits-piper-ru_RU-irina-medium.tar.bz2" lib/voice/dream_pulse_voice_backend.dart

      - name: Apply v0.15.1 streaming voice fix
        run: |
          python3 patches/v0151/patch.py
          grep -q "version: 0.15.1+35" pubspec.yaml

      - name: Apply v0.15.2 PCM16 diagnostics
        run: |
          python3 patches/v0152/patch.py
          grep -q "version: 0.15.2+36" pubspec.yaml
          grep -q "diagnoseLocalVoice" lib/avatar/speech_controller.dart
          grep -q "Диагностика · сигнал + модель + TTS" lib/ui/assistant_page.dart

      - name: Apply v0.15.3 Android Core hardening
        run: |
          python3 patches/v0153/patch.py
          grep -q "version: 0.15.3+37" pubspec.yaml
          grep -q "evidenceGate.assess" lib/core/pulse_coordinator.dart
          grep -q "await db.transaction" lib/storage/memory_store.dart
          grep -q "CORE_BUSY" lib/core/pulse_coordinator.dart
          grep -q "ConservativeEvidenceGate" lib/core/evidence_gate.dart
          rm -rf patches/v0153

      - name: Apply v0.15.4 voice foundation and analyzer cleanup
        run: |
          python3 patches/v0154/patch.py
          grep -q "version: 0.15.4+38" pubspec.yaml
          grep -q "RuVoiceSileroBridge" lib/avatar/speech_controller.dart
          grep -q "flutter_tts" pubspec.yaml
          test -f lib/voice/dream_voice_catalog.dart

      - name: Apply v0.15.5 female-only voice contract
        run: |
          python3 patches/v0155/patch.py
          python3 patches/v0155/tools/test_build_female_base_pack.py
          grep -q "version: 0.15.5+39" pubspec.yaml
          grep -q "DreamSileroEmbeddedSpec" lib/voice/dream_voice_catalog.dart
          test ! -f lib/voice/ruvoice_silero_bridge.dart
          ! grep -q 'flutter_tts:' pubspec.yaml

      - name: Apply v0.15.6 Irina voice crash diagnostics
        run: |
          python3 patches/v0156/patch.py
          grep -q 'version: 0.15.6+40' pubspec.yaml
          grep -q "voiceExit" lib/voice/dream_pulse_voice_backend.dart

      - name: Apply v0.15.8 Dream Pulse own TTS interface
        run: |
          python3 patches/v0158/patch.py
          grep -q 'version: 0.15.8+42' pubspec.yaml
          grep -q "Dream Pulse TTS" lib/voice/dream_pulse_voice_backend.dart
          ! grep -q 'vits-piper-ru_RU-irina-medium' lib/voice/dream_pulse_voice_backend.dart
          ! grep -q 'dream_pulse/voice' lib/voice/dream_pulse_voice_backend.dart
          test -f test/voice_catalog_test.dart

      - name: Apply v0.15.9 full Silero Lite reference preview
        run: |
          python3 patches/v0159/patch.py
          python3 patches/v0159/tools/test_export_full_lite.py
          grep -q 'version: 0.15.9+43' pubspec.yaml
          grep -q 'previewBaseReference' lib/voice/dream_pulse_voice_backend.dart
          grep -q 'previewSileroBaseTest' lib/avatar/speech_controller.dart

      - name: Apply v0.16.0 voice install and feedback fix
        run: |
          python3 patches/v0160/patch.py
          grep -q 'version: 0.16.0+44' pubspec.yaml
          grep -q 'dream-pulse-voice-notice' lib/ui/assistant_page.dart
          grep -q 'Импортировать веса Dream Pulse TTS' lib/ui/assistant_page.dart
          ! grep -q 'Установить Dream Voice · Zoey-style' lib/ui/assistant_page.dart
          ! grep -q 'onPressed: widget.speech.localVoiceInstalling' lib/ui/assistant_page.dart

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install Android CMake 3.31.4
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.31.4"
          test -x "$ANDROID_HOME/cmake/3.31.4/bin/cmake"

      - name: Bootstrap Android project
        run: |
          bash scripts/bootstrap_android.sh
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.intent.action.TTS_SERVICE' not in s:
              block = '''        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE" />\n        </intent>\n'''
              if '</queries>' in s:
                  s = s.replace('    </queries>', block + '    </queries>', 1)
              else:
                  s = s.replace('<application', '    <queries>\n' + block + '    </queries>\n    <application', 1)
          p.write_text(s)
          PY
          grep -q 'com.dreampulse.assistant' android/app/build.gradle.kts
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml
          test -f android/app/dream-pulse-test.jks
          test -f android/app/src/main/res/drawable/dream_pulse_icon.xml

      - name: Install v0.11 native video bridge
        run: |
          python3 patches/v011/patch_android.py
          grep -q 'dream_pulse/media' android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          grep -q 'MediaMetadataRetriever' android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          rm -rf patches/v011

      - name: Install v0.15 sherpa-onnx voice runtime
        run: |
          mkdir -p android/app/src/main/kotlin/com/dreampulse/assistant
          cp patches/v015/android/MainActivity.kt android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          cp patches/v015/android/DreamPulseVoiceEngine.kt android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          cp patches/v015/android/DreamPulseVoiceService.kt android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceService.kt
          python3 patches/v015/patch_android.py

          grep -q 'dream_pulse/voice' android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          grep -q 'class DreamPulseVoiceEngine' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          grep -q 'class DreamPulseVoiceService' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceService.kt
          grep -q 'android:process=":voice"' android/app/src/main/AndroidManifest.xml
          grep -q 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v1.13.8' android/app/build.gradle.kts
          grep -q 'https://jitpack.io' android/build.gradle.kts
          ! grep -q 'pytorch_android_lite' android/app/build.gradle.kts
          ! grep -q 'executorch' android/app/build.gradle.kts
          ! grep -q 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml

          rm -rf patches/v012 patches/v013 patches/v014 patches/v015

      - name: Install v0.15.1 streaming voice runtime
        run: |
          cp patches/v0151/android/DreamPulseVoiceEngine.kt android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          cp patches/v0151/android/DreamPulseVoiceService.kt android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceService.kt
          grep -q 'generateWithConfigAndCallback' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          grep -q 'audio_first_chunk' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          grep -q 'stopSelfResult' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceService.kt
          ! grep -q 'killProcess' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceService.kt
          rm -rf patches/v0151

      - name: Install v0.15.2 PCM16 diagnostic runtime
        run: |
          cp patches/v0152/android/DreamPulseVoiceEngine.kt android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          cp patches/v0152/android/DreamPulseVoiceService.kt android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceService.kt
          python3 patches/v0152/patch_android.py
          grep -q 'ENCODING_PCM_16BIT' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          grep -q 'fun diagnose' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          grep -q 'ACTION_DIAGNOSE' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceService.kt
          grep -q '"diagnose"' android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          rm -rf patches/v0152

      - name: Enable RuVoice engine discovery on Android
        run: |
          python3 patches/v0154/patch_android.py
          grep -q 'android.intent.action.TTS_SERVICE' android/app/src/main/AndroidManifest.xml
          rm -rf patches/v0154

      - name: Remove external RuVoice discovery
        run: |
          python3 patches/v0155/patch_android.py
          rm -rf patches/v0155

      - name: Harden isolated Irina voice Android runtime
        run: |
          python3 patches/v0156/patch_android.py
          grep -q 'private val audioLock' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          grep -q 'ACTION_STOP' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceService.kt
          grep -q 'lastVoiceExit' android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          rm -rf patches/v0156

      - name: Remove Piper and enable Dream Pulse local pack management
        run: |
          python3 patches/v0158/patch_android.py
          grep -q 'dream_pulse/tts' android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          grep -q 'class DreamPulseSileroPackStore' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseSileroPackStore.kt
          ! grep -q 'sherpa-onnx' android/app/build.gradle.kts
          ! grep -q 'DreamPulseVoiceService' android/app/src/main/AndroidManifest.xml
          test ! -f android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseVoiceEngine.kt
          rm -rf patches/v0158

      - name: Install isolated full TorchScript Lite Silero Android runtime
        run: |
          python3 patches/v0159/patch_android.py
          grep -q 'org.pytorch:pytorch_android_lite:2.1.0' android/app/build.gradle.kts
          grep -q 'DreamPulseSileroPreviewService' android/app/src/main/AndroidManifest.xml
          grep -q 'previewBase' android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          test -f android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseSileroLiteSynth.kt
          rm -rf patches/v0159

      - name: Remove TTS installer patch sources before Flutter analysis
        run: rm -rf patches/v0160

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Core regression tests
        run: flutter test test/core_hardening_test.dart

      - name: Voice catalogue regression tests
        run: flutter test test/voice_catalog_test.dart

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify Piper removed from Dream Pulse APK
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          ! unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libsherpa-onnx-jni.so$'
          ! grep -q 'sherpa-onnx' android/app/build.gradle.kts
          ! grep -q 'DreamPulseVoiceService' android/app/src/main/AndroidManifest.xml
          grep -q 'dream_pulse/tts' android/app/src/main/kotlin/com/dreampulse/assistant/MainActivity.kt
          grep -q 'class DreamPulseSileroPackStore' android/app/src/main/kotlin/com/dreampulse/assistant/DreamPulseSileroPackStore.kt
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-pulse-v0.16.0-voice-import-ui-fix-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  export-reference-pack:
    name: Convert original v5_5_ru to installable Dream Pulse model ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CPU PyTorch for reference export
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print('Export Torch:', torch.__version__)"

      - name: Download original Silero model (noncommercial license)
        run: |
          mkdir -p ${RUNNER_TEMP}/silero-src
          curl --fail --location --retry 4 --retry-delay 5 \
            --connect-timeout 30 --max-time 900 \
            'https://models.silero.ai/models/tts/ru/v5_5_ru.pt' \
            --output "${RUNNER_TEMP}/silero-src/v5_5_ru.pt"
          test -s "${RUNNER_TEMP}/silero-src/v5_5_ru.pt"
          sha256sum "${RUNNER_TEMP}/silero-src/v5_5_ru.pt"

      - name: Convert and numerically verify model
        run: |
          mkdir -p "${RUNNER_TEMP}/silero-out"
          python patches/v0159/tools/export_full_lite.py \
            --source-model "${RUNNER_TEMP}/silero-src/v5_5_ru.pt" \
            --output "${RUNNER_TEMP}/silero-out/dream-pulse-silero-full-lite.zip"
          test -s "${RUNNER_TEMP}/silero-out/dream-pulse-silero-full-lite.zip"

      - name: Include license and installation instructions
        run: |
          cat > "${RUNNER_TEMP}/silero-out/README.txt" <<'TEXT'
          Dream Pulse TTS · original Silero v5_5_ru
          =========================================
          This ZIP contains converted ORIGINAL model weights.
          It is a technical test pack for the Baya source speaker.
          It is NOT the trained Irina voice or the four author-created voices.

          License: CC BY-NC-SA 4.0 (noncommercial, attribution, share-alike).
          Source: https://github.com/snakers4/silero-models
          Original weights: https://models.silero.ai/models/tts/ru/v5_5_ru.pt
          License text: https://creativecommons.org/licenses/by-nc-sa/4.0/legalcode

          In Dream Pulse v0.16.0:
          Voice settings > Import Dream Pulse TTS weights > select
          dream-pulse-silero-full-lite.zip > Technical Silero test.
          TEXT

      - name: Validate ZIP integrity and manifest
        run: |
          python - <<'PY'
          import json, os, zipfile
          path = os.environ['RUNNER_TEMP'] + '/silero-out/dream-pulse-silero-full-lite.zip'
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              names = set(z.namelist())
              assert names == {'silero/model.ptl', 'silero/symbols.json', 'silero/manifest.json'}
              manifest = json.loads(z.read('silero/manifest.json'))
              assert manifest['model_id'] == 'v5_5_ru'
              assert manifest['license'] == 'CC BY-NC-SA 4.0'
              assert manifest['silero_backend_test_only'] is True
              assert manifest['trained_user_voices'] == []
              print('Verified ZIP:', os.path.getsize(path), 'bytes')
          PY

      - name: Upload developer-only Silero reference pack
        uses: actions/upload-artifact@v4
        with:
          name: dream-pulse-silero-full-lite-reference-weights
          path: ${{ runner.temp }}/silero-out/
          if-no-files-found: error
          retention-days: 7
