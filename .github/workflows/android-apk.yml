name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ci/**'
      - '.github/workflows/android-apk.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified source tree
        run: |
          cat ci/source2.part.00 \
              ci/source2.part.01 \
              ci/source2.part.02 \
              ci/source2.part.03 \
              ci/source2.part.04 \
              ci/source2.part.05 \
              ci/source2.part.06 \
              ci/source2.part.07 \
              ci/source2.part.08 > /tmp/source.b64
          echo "f560e7fcef942060f2bcd1e20117c55914729991c4ee0c599461f3c9b3c5bf31  /tmp/source.b64" | sha256sum -c -
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          echo "98ac0918ba80ff9dea153f24abc863595252f5d778e51ca6bae0ec9a3b3b288d  /tmp/source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/source.tar.gz -C .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f scripts/bootstrap_android.sh

      - name: Apply Flutter 3.47 compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/avatar/avatar_stage.dart')
          s = p.read_text()
          s = s.replace(
              "import 'package:flutter/material.dart';",
              "import 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';",
          )
          s = s.replace(
              "    animations = List<three.AnimationClip>.from(gltf.animations);",
              "    final loadedAnimations = gltf.animations;\n"
              "    animations = loadedAnimations == null\n"
              "        ? <three.AnimationClip>[]\n"
              "        : loadedAnimations.whereType<three.AnimationClip>().toList();",
          )
          s = s.replace(
              "      final delta = dt is num ? dt.toDouble() : 0.016;",
              "      final delta = dt.toDouble();",
          )
          p.write_text(s)

          p = Path('lib/ui/assistant_page.dart')
          s = p.read_text().replace('FilePicker.platform.pickFiles(', 'FilePicker.pickFiles(')
          p.write_text(s)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Bootstrap Android project
        run: |
          bash scripts/bootstrap_android.sh
          rm -f test/widget_test.dart

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dream-pulse-v0.7-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
