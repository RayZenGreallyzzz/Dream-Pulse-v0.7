name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'ci/source3.part.*'
      - '.github/workflows/android-apk.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified Dream Pulse v0.8 source
        run: |
          cat ci/source3.part.00 ci/source3.part.01 ci/source3.part.02 ci/source3.part.03 \
              ci/source3.part.04 ci/source3.part.05 ci/source3.part.06 ci/source3.part.07 > /tmp/source3.b64
          echo "b7870b0489d0138ae3b7e175a722d63b93a8639bc31557410a3d26b30179c9d9  /tmp/source3.b64" | sha256sum -c -
          base64 -d /tmp/source3.b64 > /tmp/source3.tar.gz
          echo "318d6b0fe7921984a51ee680756be1d4f94815e9df427d5a76a1f240dd6cd5e8  /tmp/source3.tar.gz" | sha256sum -c -
          tar -xzf /tmp/source3.tar.gz -C .
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/llm/qwen_model_installer.dart
          test -f scripts/bootstrap_android.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install Android CMake 3.31.4
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "cmake;3.31.4"
          test -x "$ANDROID_HOME/cmake/3.31.4/bin/cmake"

      - name: Bootstrap Android project
        run: |
          bash scripts/bootstrap_android.sh
          rm -f test/widget_test.dart

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-pulse-v0.8-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
