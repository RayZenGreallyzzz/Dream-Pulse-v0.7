name: Diagnose Voice Native Runtime

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-voice-runtime.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Download RuVoice full and ExecuTorch AAR
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3             -o /tmp/ruvoice.apk             https://github.com/kost-t-human/ruvoice-tts/releases/download/v0.18.4/ruvoice-tts-0.18.4.apk
          curl -L --fail --retry 3             -o /tmp/executorch.aar             https://ossci-android.s3.amazonaws.com/executorch/release/1.5.0-xnnpack/executorch.aar

      - name: Recreate current Dream Pulse ExecuTorch AAR
        run: |
          set -euxo pipefail
          rm -rf /tmp/aar
          mkdir -p /tmp/aar
          (cd /tmp/aar && unzip -q /tmp/executorch.aar)
          mkdir -p /tmp/aar/jni/arm64-v8a
          unzip -p /tmp/ruvoice.apk lib/arm64-v8a/libexecutorch.so             > /tmp/aar/jni/arm64-v8a/libexecutorch.so

      - name: Compare native libraries
        run: |
          set -euo pipefail
          echo "=== RuVoice APK ARM64 libs ==="
          unzip -Z1 /tmp/ruvoice.apk | grep '^lib/arm64-v8a/' | sort
          echo
          echo "=== Dream Pulse reconstructed AAR ARM64 libs ==="
          find /tmp/aar/jni/arm64-v8a -maxdepth 1 -type f -printf '%f\n' | sort
          echo
          echo "=== SHA comparison for common libs ==="
          mkdir -p /tmp/rvlibs
          unzip -q /tmp/ruvoice.apk 'lib/arm64-v8a/*' -d /tmp/rvlibs
          for f in /tmp/aar/jni/arm64-v8a/*.so; do
            n=$(basename "$f")
            rv="/tmp/rvlibs/lib/arm64-v8a/$n"
            if [ -f "$rv" ]; then
              a=$(sha256sum "$f" | awk '{print $1}')
              b=$(sha256sum "$rv" | awk '{print $1}')
              if [ "$a" = "$b" ]; then state=SAME; else state=DIFF; fi
              echo "$n $state dream=$a ruvoice=$b"
            else
              echo "$n ONLY_IN_AAR"
            fi
          done
          echo
          echo "=== RuVoice libs missing from reconstructed AAR ==="
          for rv in /tmp/rvlibs/lib/arm64-v8a/*.so; do
            n=$(basename "$rv")
            [ -f "/tmp/aar/jni/arm64-v8a/$n" ] || echo "$n"
          done

      - name: Inspect Java runtime references
        run: |
          set -euo pipefail
          echo "=== SoLoader references in ExecuTorch classes ==="
          unzip -p /tmp/executorch.aar classes.jar > /tmp/classes.jar
          strings /tmp/classes.jar | grep -i 'soloader' | head -50 || true
          echo "=== AAR metadata ==="
          unzip -Z1 /tmp/executorch.aar | sort | head -200
      - name: Download final Dream Pulse v0.14.1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/dp
          gh run download 37981344136             --repo "${GITHUB_REPOSITORY}"             --name dream-pulse-v0.14.1-safe-voice-final-diagnostics-arm64-apk             --dir /tmp/dp
          test -s /tmp/dp/app-release.apk

      - name: Compare final APK native libraries with RuVoice
        run: |
          set -euo pipefail
          rm -rf /tmp/dplibs /tmp/rvfinal
          mkdir -p /tmp/dplibs /tmp/rvfinal
          unzip -q /tmp/dp/app-release.apk 'lib/arm64-v8a/*' -d /tmp/dplibs
          unzip -q /tmp/ruvoice.apk 'lib/arm64-v8a/*' -d /tmp/rvfinal

          echo "=== Dream Pulse final APK ARM64 libs ==="
          find /tmp/dplibs/lib/arm64-v8a -type f -printf '%f\n' | sort

          echo "=== Final APK vs RuVoice SHA ==="
          for f in /tmp/dplibs/lib/arm64-v8a/*.so; do
            n=$(basename "$f")
            rv="/tmp/rvfinal/lib/arm64-v8a/$n"
            if [ -f "$rv" ]; then
              a=$(sha256sum "$f" | awk '{print $1}')
              b=$(sha256sum "$rv" | awk '{print $1}')
              if [ "$a" = "$b" ]; then state=SAME; else state=DIFF; fi
              echo "$n $state dream=$a ruvoice=$b"
            else
              echo "$n ONLY_IN_DREAM_PULSE"
            fi
          done

          echo "=== RuVoice libs absent from final Dream Pulse APK ==="
          for f in /tmp/rvfinal/lib/arm64-v8a/*.so; do
            n=$(basename "$f")
            [ -f "/tmp/dplibs/lib/arm64-v8a/$n" ] || echo "$n"
          done

