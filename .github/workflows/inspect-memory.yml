name: Inspect Pulse Memory

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-memory.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          cat ci/v08m.part.00 ci/v08m.part.01 ci/v08m.part.02 > /tmp/v08.b64
          base64 -d /tmp/v08.b64 > /tmp/v08.tar.gz
          tar -xzf /tmp/v08.tar.gz -C .
      - name: Print memory and pulse UI
        run: |
          echo '===== memory_store.dart ====='
          sed -n '1,420p' lib/storage/memory_store.dart
          echo '===== home_page.dart ====='
          sed -n '1,460p' lib/ui/home_page.dart
          echo '===== models.dart ====='
          sed -n '1,240p' lib/core/models.dart
